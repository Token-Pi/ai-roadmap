name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check subset fonts
        id: check_fonts
        run: |
          missing=0
          for f in NotoSerifSC-400.woff2 NotoSerifSC-600.woff2 Fraunces-600-opsz72.woff2 IBMPlexMono-500.woff2; do
            if [ ! -f "shared/fonts/$f" ]; then
              missing=1
              break
            fi
          done
          echo "missing=$missing" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.check_fonts.outputs.missing == '1'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install font build dependencies
        if: steps.check_fonts.outputs.missing == '1'
        run: python3 -m pip install --no-cache-dir fonttools brotli

      - name: Build subset fonts
        if: steps.check_fonts.outputs.missing == '1'
        run: |
          python3 tools/build_fonts.py
          rm -rf .fontsrc

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
